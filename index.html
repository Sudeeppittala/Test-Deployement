    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Inter', 'sans-serif'], 
              display: ['Inter', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#4B0082', // Placemein Deep Purple
                dark: '#2E0052',    // Darker shade
                light: '#F3E8FF',   // Light Lavender
              },
              accent: {
                DEFAULT: '#6A0DAD', // Bright Purple
                light: '#E9D5FF',   // Lighter accent
              },
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
              'out-back': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            animation: {
              'fade-in': 'fadeIn 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'slide-up': 'slideUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'slide-in-right': 'slideInRight 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(30px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* CRITICAL: Ensure form elements inherit the font family */
      input, textarea, button, select {
        font-family: inherit;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .active-card {
        border-color: #4B0082 !important;
        border-width: 1px !important;
        background-color: #FFFFFF !important;
        box-shadow: 0 20px 40px -10px rgba(75, 0, 130, 0.1);
        transform: scale(1.005);
      }
      .dark .active-card {
        background-color: #18181b !important; /* zinc-900 */
        border-color: #F3E8FF !important; /* primary-light */
        box-shadow: 0 20px 40px -10px rgba(243, 232, 255, 0.05);
      }
      /* Loading Skeleton Shimmer */
      .skeleton {
        background: #f0f0f0;
        background-image: linear-gradient(to right, #f0f0f0 0%, #f8f8f8 20%, #f0f0f0 40%, #f0f0f0 100%);
        background-repeat: no-repeat;
        background-size: 200% 100%; 
        animation: shimmer 1.5s infinite linear; 
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
    </style>
  </head>
  <body class="selection:bg-primary/20 selection:text-primary-dark font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
